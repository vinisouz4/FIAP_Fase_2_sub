<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="1500" height="620" fill="#ffffff"/>
  <text x="750" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">Pipeline Batch - Preço do Petróleo Brent (Ipeadata → S3 → Glue → Athena)</text>
  <text x="750" y="62" text-anchor="middle" font-size="13" fill="#607d8b">FIAP Pós Tech - Machine Learning Engineering - Fase 2</text>

  <!-- AWS cloud boundary -->
  <rect x="250" y="85" width="1230" height="470" rx="12" fill="#fafafa" stroke="#232f3e" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="268" y="108" font-size="14" font-weight="bold" fill="#232f3e">AWS Cloud (AWS Academy Learner Lab - role LabRole)</text>

  <!-- 1. Ipea -->
  <rect x="20" y="250" width="190" height="110" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="115" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">Ipeadata</text>
  <text x="115" y="312" text-anchor="middle" font-size="12" fill="#0d47a1">Brent FOB (US$/barril)</text>
  <text x="115" y="330" text-anchor="middle" font-size="12" fill="#0d47a1">série diária - HTML</text>
  <text x="115" y="348" text-anchor="middle" font-size="11" fill="#0d47a1">(fallback: API OData)</text>

  <!-- 2. Scraper -->
  <rect x="290" y="240" width="200" height="130" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="390" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">Scraper Python</text>
  <text x="390" y="298" text-anchor="middle" font-size="12" fill="#e65100">requests + pandas.read_html</text>
  <text x="390" y="316" text-anchor="middle" font-size="12" fill="#e65100">grava Parquet (pyarrow)</text>
  <text x="390" y="340" text-anchor="middle" font-size="11" fill="#bf360c">Cloud9 / EC2 / Lambda</text>
  <text x="390" y="356" text-anchor="middle" font-size="11" fill="#bf360c">ipea_scraper.py</text>

  <!-- 3. S3 raw -->
  <rect x="540" y="240" width="210" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="645" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">S3 - camada RAW</text>
  <text x="645" y="295" text-anchor="middle" font-size="12" fill="#1b5e20">Parquet + snappy</text>
  <text x="645" y="316" text-anchor="middle" font-size="11" fill="#1b5e20">raw/petroleo_brent/</text>
  <text x="645" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">dt_ingestao=YYYY-MM-DD/</text>
  <text x="645" y="354" text-anchor="middle" font-size="11" fill="#388e3c">partição diária</text>

  <!-- 4. Glue job -->
  <rect x="800" y="240" width="210" height="130" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="905" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#311b92">AWS Glue Job</text>
  <text x="905" y="295" text-anchor="middle" font-size="12" fill="#311b92">PySpark - Glue 4.0</text>
  <text x="905" y="316" text-anchor="middle" font-size="12" fill="#311b92">dedup + média móvel 7 dias</text>
  <text x="905" y="334" text-anchor="middle" font-size="11" fill="#4527a0">Window.rangeBetween(-6d, 0)</text>
  <text x="905" y="354" text-anchor="middle" font-size="11" fill="#4527a0">getSink(enableUpdateCatalog)</text>

  <!-- 5a. S3 refined -->
  <rect x="1070" y="160" width="190" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1165" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">S3 - REFINED</text>
  <text x="1165" y="214" text-anchor="middle" font-size="12" fill="#1b5e20">Parquet particionado</text>
  <text x="1165" y="232" text-anchor="middle" font-size="11" fill="#1b5e20">refined/petroleo_media_movel/</text>
  <text x="1165" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">ano=YYYY/</text>

  <!-- 5b. Glue catalog -->
  <rect x="1070" y="340" width="190" height="110" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="1165" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#311b92">Glue Data Catalog</text>
  <text x="1165" y="394" text-anchor="middle" font-size="12" fill="#311b92">database: default</text>
  <text x="1165" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#311b92">petroleo_media_movel</text>
  <text x="1165" y="432" text-anchor="middle" font-size="11" fill="#4527a0">criada automaticamente</text>

  <!-- 6. Athena -->
  <rect x="1310" y="240" width="150" height="130" rx="10" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="1385" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#01579b">Amazon Athena</text>
  <text x="1385" y="304" text-anchor="middle" font-size="12" fill="#01579b">consultas SQL</text>
  <text x="1385" y="322" text-anchor="middle" font-size="12" fill="#01579b">serverless</text>
  <text x="1385" y="346" text-anchor="middle" font-size="11" fill="#0277bd">resultados em</text>
  <text x="1385" y="361" text-anchor="middle" font-size="11" fill="#0277bd">s3://.../athena-results/</text>

  <!-- 7. Viz -->
  <rect x="1310" y="450" width="150" height="85" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
  <text x="1385" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#880e4f">Visualização</text>
  <text x="1385" y="502" text-anchor="middle" font-size="12" fill="#880e4f">matplotlib +</text>
  <text x="1385" y="518" text-anchor="middle" font-size="12" fill="#880e4f">awswrangler</text>

  <!-- Orchestration (optional) -->
  <rect x="540" y="450" width="470" height="85" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="775" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#f57f17">Orquestração / Observabilidade (opcional)</text>
  <text x="775" y="500" text-anchor="middle" font-size="12" fill="#f57f17">EventBridge (agenda diária) → Lambda scraper → Glue Trigger</text>
  <text x="775" y="520" text-anchor="middle" font-size="12" fill="#f57f17">CloudWatch Logs (scraper + Glue)  |  IAM LabRole</text>

  <!-- Arrows -->
  <line x1="210" y1="305" x2="288" y2="305" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="249" y="296" text-anchor="middle" font-size="11" fill="#37474f">HTTP GET</text>
  <line x1="490" y1="305" x2="538" y2="305" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="514" y="296" text-anchor="middle" font-size="11" fill="#37474f">put</text>
  <line x1="750" y1="305" x2="798" y2="305" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="774" y="296" text-anchor="middle" font-size="11" fill="#37474f">read</text>
  <line x1="1010" y1="270" x2="1068" y2="230" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1058" y="262" text-anchor="middle" font-size="11" fill="#37474f">write</text>
  <line x1="1010" y1="340" x2="1068" y2="380" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1056" y="368" text-anchor="middle" font-size="11" fill="#37474f">schema</text>
  <line x1="1260" y1="220" x2="1340" y2="238" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1315" y="218" text-anchor="middle" font-size="11" fill="#37474f">dados</text>
  <line x1="1260" y1="400" x2="1340" y2="372" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1316" y="398" text-anchor="middle" font-size="11" fill="#37474f">metadados</text>
  <line x1="1385" y1="370" x2="1385" y2="448" stroke="#37474f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1420" y="412" font-size="11" fill="#37474f">SQL</text>
  <line x1="775" y1="450" x2="775" y2="372" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="20" y="590" font-size="12" fill="#546e7a">Fluxo: scraping (Ipeadata) → Parquet particionado por dia de ingestão (raw) → Glue (média móvel 7d) → Parquet por ano (refined) + tabela no Glue Catalog → consulta SQL no Athena → gráfico.</text>
</svg>
